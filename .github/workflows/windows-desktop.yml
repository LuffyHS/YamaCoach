name: Build Yama Coach for Windows

on:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - "app/download/page.tsx"
      - ".github/workflows/windows-desktop.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-installer:
    runs-on: windows-latest
    steps:
      - name: Get source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install desktop dependencies
        run: npm install --no-audit --no-fund
        working-directory: desktop
      - name: Configure production address
        shell: pwsh
        env:
          YAMA_APP_URL: https://yamacoach.onrender.com
        run: |
          $target = [Uri]$env:YAMA_APP_URL
          if ($target.Scheme -ne "https") { throw "YAMA_APP_URL must use HTTPS." }
          Set-Content -Path desktop/.env.production -Value "YAMA_APP_URL=$env:YAMA_APP_URL" -NoNewline
      - name: Build Windows installer
        run: npm run build:win
        working-directory: desktop
      - name: Generate latest.yml for auto-updater
        shell: pwsh
        run: |
          $version = (Get-Content desktop/package.json | ConvertFrom-Json).version
          $exe = "desktop/release/YamaCoach-Setup.exe"
          $size = (Get-Item $exe).Length
          $hash = (Get-FileHash $exe -Algorithm SHA512).Hash
          $bytes = [byte[]]::new($hash.Length / 2)
          for ($i = 0; $i -lt $hash.Length; $i += 2) { $bytes[$i/2] = [Convert]::ToByte($hash.Substring($i, 2), 16) }
          $sha512 = [Convert]::ToBase64String($bytes)
          $releaseDate = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ss.fffZ")
          $yml = @"
version: $version
files:
  - url: YamaCoach-Setup.exe
    sha512: $sha512
    size: $size
path: YamaCoach-Setup.exe
sha512: $sha512
releaseDate: '$releaseDate'
"@
          Set-Content -Path "desktop/release/latest.yml" -Value $yml -NoNewline
          Write-Host "Generated latest.yml:"
          Get-Content "desktop/release/latest.yml"
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "desktop-build-${{ github.run_number }}-${{ github.run_attempt }}"
          $version = (Get-Content desktop/package.json | ConvertFrom-Json).version
          gh release create $tag desktop/release/YamaCoach-Setup.exe desktop/release/latest.yml --repo $env:GITHUB_REPOSITORY --title "Yama Coach para Windows $version ($tag)" --notes "Instalador Windows x64 do Yama Coach v$version."
